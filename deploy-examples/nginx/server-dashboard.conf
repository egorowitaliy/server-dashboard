server {
    # Пример использует TEST-NET-1. Перед установкой замените адрес и сеть.
    listen 192.0.2.10:80;
    server_name dashboard.example.lan;

    root /opt/server-dashboard/web/public;
    index index.php;

    access_log /var/log/server-dashboard/access.log;
    error_log  /var/log/server-dashboard/nginx-error.log warn;

    server_tokens off;

    allow 192.0.2.0/24;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/server-dashboard/web/public/index.php;
        fastcgi_pass unix:/run/php/server-dashboard.sock;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 10s;
    }

    location = /login {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/server-dashboard/web/public/login.php;
        fastcgi_pass unix:/run/php/server-dashboard.sock;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 10s;
    }

    location = /logout {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/server-dashboard/web/public/logout.php;
        fastcgi_pass unix:/run/php/server-dashboard.sock;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 10s;
    }

    # Изменяющие операции могут ждать restart Docker/systemd до 60 секунд.
    # Этот timeout намеренно больше ACTION_TIMEOUT=70s PHP-клиента.
    location = /api/action {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/server-dashboard/web/public/api.php;
        fastcgi_pass unix:/run/php/server-dashboard.sock;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 75s;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/server-dashboard/web/public/api.php;
        fastcgi_pass unix:/run/php/server-dashboard.sock;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 5s;
        fastcgi_read_timeout 15s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
    }
}
