[server-dashboard]

user = server-dashboard-web
group = server-dashboard-web

listen = /run/php/server-dashboard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

clear_env = yes
catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/server-dashboard/php-error.log

php_admin_flag[expose_php] = off

php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.gc_maxlifetime] = 172800
